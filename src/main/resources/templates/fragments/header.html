<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-header" th:fragment="header">
  <div class="header-left">
    <button class="mobile-menu-btn" type="button" aria-label="Open menu" data-mobile-menu-toggle>
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
    <div class="brand">TestOps</div>
    <div class="divider"></div>
    <label class="select-wrap">
      <span class="sr-only">Project</span>
      <select aria-label="Select project">
        <option>All Projects</option>
        <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.name}">Project Name</option>
      </select>
    </label>
  </div>

  <div class="header-right">
    <div class="search-bar">
      <i data-lucide="search" aria-hidden="true"></i>
      <input type="text" placeholder="Search scripts, runs, projects..." aria-label="Search" />
      <kbd>Ctrl+K</kbd>
      <div class="search-results" hidden>
        <div class="search-heading">Quick Actions</div>
        <button type="button" class="search-item">Create new script</button>
        <button type="button" class="search-item">Run test</button>
      </div>
    </div>

    <button class="icon-button" type="button" aria-label="Notifications">
      <i data-lucide="bell" aria-hidden="true"></i>
      <span class="status-dot"></span>
    </button>

    <div class="user-menu" data-menu>
      <button class="user-button" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar">A</div>
        <span class="user-label">Admin</span>
        <i data-lucide="chevron-down" aria-hidden="true"></i>
      </button>
      <div class="user-dropdown" hidden>
        <div class="user-meta">
          <p class="name">Admin</p>
          <p class="email">admin@testops.com</p>
        </div>
        <button type="button" class="menu-link">Profile</button>
        <button type="button" class="menu-link">Settings</button>
        <button type="button" class="menu-link">Sign out</button>
      </div>
    </div>
  </div>
</header>
</body>
</html>
