<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Test Plans</h1>
      <p>Create and manage load test plans</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="load-test-plan-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Test Plan
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>All Test Plans</h3>
    </div>
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Plan Name</th>
            <th>Type</th>
            <th>Target RPS</th>
            <th>Duration</th>
            <th>Last Run</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="load-test-plans-body"></tbody>
      </table>
    </div>
  </div>

  <div id="load-test-plan-modal" class="modal" role="dialog" aria-labelledby="load-test-plan-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('load-test-plan-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="load-test-plan-title">Load Test Plan</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('load-test-plan-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="load-test-plan-form">
        <input type="hidden" id="load-test-plan-id">
        <div class="form-group">
          <label class="label" for="load-test-plan-name">Plan Name</label>
          <input id="load-test-plan-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-test-plan-type">Type</label>
          <select id="load-test-plan-type" class="input">
            <option>Load</option>
            <option>Stress</option>
            <option>Spike</option>
            <option>Endurance</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label" for="load-test-plan-rps">Target RPS</label>
          <input id="load-test-plan-rps" class="input" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-test-plan-duration">Duration</label>
          <input id="load-test-plan-duration" class="input" type="text" placeholder="30 min" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('load-test-plan-modal')">Cancel</button>
        <button type="submit" form="load-test-plan-form" class="btn btn-primary">Save Plan</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
