<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Test Plans</h1>
      <p>Create and manage load test plans</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Test Plan
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>All Test Plans</h3>
    </div>
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Plan Name</th>
            <th>Type</th>
            <th>Target RPS</th>
            <th>Duration</th>
            <th>Last Run</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="font-medium">API Load Test</span></td>
            <td>Load</td>
            <td>1,000</td>
            <td>30 min</td>
            <td>Today, 2:30 PM</td>
            <td>
              <button class="btn btn-sm btn-ghost">Run</button>
              <button class="btn btn-sm btn-ghost">Edit</button>
            </td>
          </tr>
          <tr>
            <td><span class="font-medium">Stress Test</span></td>
            <td>Stress</td>
            <td>5,000</td>
            <td>1 hour</td>
            <td>Yesterday</td>
            <td>
              <button class="btn btn-sm btn-ghost">Run</button>
              <button class="btn btn-sm btn-ghost">Edit</button>
            </td>
          </tr>
          <tr>
            <td><span class="font-medium">Spike Test</span></td>
            <td>Spike</td>
            <td>10,000</td>
            <td>15 min</td>
            <td>2 days ago</td>
            <td>
              <button class="btn btn-sm btn-ghost">Run</button>
              <button class="btn btn-sm btn-ghost">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
