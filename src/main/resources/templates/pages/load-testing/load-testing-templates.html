<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Load Test Templates</h1>
      <p>Pre-configured load testing templates</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="load-template-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Create Template
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Available Templates</h3>
    </div>
    <div class="grid-cols-3" id="load-templates-grid"></div>
  </div>

  <div id="load-template-modal" class="modal" role="dialog" aria-labelledby="load-template-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('load-template-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="load-template-title">Load Template</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('load-template-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="load-template-form">
        <input type="hidden" id="load-template-id">
        <div class="form-group">
          <label class="label" for="load-template-name">Template Name</label>
          <input id="load-template-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-template-description">Description</label>
          <input id="load-template-description" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-template-vus">Virtual Users</label>
          <input id="load-template-vus" class="input" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-template-duration">Duration</label>
          <input id="load-template-duration" class="input" type="text" placeholder="10 min" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('load-template-modal')">Cancel</button>
        <button type="submit" form="load-template-form" class="btn btn-primary">Save Template</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
