<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>AI-Based Load Testing</h1>
      <p>AI-powered load test scenario generation</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="load-ai-scenario-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Generate Scenario
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card" style="background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.2);">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">AI Scenarios</span>
        <svg class="w-5 h-5 opacity-70" style="color: #8b5cf6;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      </div>
      <p class="text-3xl">28</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Avg Optimization</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
      </div>
      <p class="text-3xl">34%</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>AI-Generated Scenarios</h3>
    </div>
    <ul class="list-rows" id="load-ai-scenarios-list"></ul>
  </div>

  <div id="load-ai-scenario-modal" class="modal" role="dialog" aria-labelledby="load-ai-scenario-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('load-ai-scenario-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="load-ai-scenario-title">AI Scenario</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('load-ai-scenario-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="load-ai-scenario-form">
        <input type="hidden" id="load-ai-scenario-id">
        <div class="form-group">
          <label class="label" for="load-ai-scenario-name">Scenario Name</label>
          <input id="load-ai-scenario-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-ai-scenario-notes">Notes</label>
          <input id="load-ai-scenario-notes" class="input" type="text" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('load-ai-scenario-modal')">Cancel</button>
        <button type="submit" form="load-ai-scenario-form" class="btn btn-primary">Save Scenario</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
