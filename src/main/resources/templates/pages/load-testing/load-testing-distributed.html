<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Distributed Testing</h1>
      <p>Configure distributed load testing across multiple agents</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="load-agent-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add Agent
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Active Agents</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
      </div>
      <p class="text-3xl">4</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Total VUs</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/></svg>
      </div>
      <p class="text-3xl">4,000</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Total RPS</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <p class="text-3xl">10,000</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Agent List</h3>
    </div>
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Agent Name</th>
            <th>IP Address</th>
            <th>Status</th>
            <th>Allocated VUs</th>
            <th>Current RPS</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="load-agents-body"></tbody>
      </table>
    </div>
  </div>

  <div id="load-agent-modal" class="modal" role="dialog" aria-labelledby="load-agent-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('load-agent-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="load-agent-title">Distributed Agent</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('load-agent-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="load-agent-form">
        <input type="hidden" id="load-agent-id">
        <div class="form-group">
          <label class="label" for="load-agent-name">Agent Name</label>
          <input id="load-agent-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-agent-ip">IP Address</label>
          <input id="load-agent-ip" class="input" type="text" placeholder="192.168.1.110" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-agent-vus">Allocated VUs</label>
          <input id="load-agent-vus" class="input" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label class="label" for="load-agent-rps">Current RPS</label>
          <input id="load-agent-rps" class="input" type="number" min="1" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('load-agent-modal')">Cancel</button>
        <button type="submit" form="load-agent-form" class="btn btn-primary">Save Agent</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
