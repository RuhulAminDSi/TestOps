<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content settings-page">
  <div class="page-header">
    <div>
      <h1>Projects & Environments</h1>
      <p>Manage projects and environments</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="settings-project-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Project
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Projects</h3>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Project Name</th>
            <th>Environments</th>
            <th>Last Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="settings-projects-body"></tbody>
      </table>
    </div>
  </div>

  <div id="settings-project-modal" class="modal" role="dialog" aria-labelledby="settings-project-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('settings-project-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settings-project-title">Settings Project</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('settings-project-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="settings-project-form">
        <input type="hidden" id="settings-project-id">
        <div class="form-group">
          <label class="label" for="settings-project-name">Project Name</label>
          <input id="settings-project-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="settings-project-envs">Environments</label>
          <input id="settings-project-envs" class="input" type="text" placeholder="3 (Dev, Staging, Prod)" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('settings-project-modal')">Cancel</button>
        <button type="submit" form="settings-project-form" class="btn btn-primary">Save Project</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
