<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Projects & Environments</h1>
      <p>Manage projects and environments</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Project
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Projects</h3>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Project Name</th>
            <th>Environments</th>
            <th>Last Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="font-medium">Demo Project</span></td>
            <td>3 (Dev, Staging, Prod)</td>
            <td>Today</td>
            <td><button class="btn btn-sm btn-ghost">Edit</button></td>
          </tr>
          <tr>
            <td><span class="font-medium">E2E Tests</span></td>
            <td>2 (QA, Prod)</td>
            <td>Yesterday</td>
            <td><button class="btn btn-sm btn-ghost">Edit</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
