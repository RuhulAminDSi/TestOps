<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content settings-page">
  <div class="page-header">
    <div>
      <h1>Integrations</h1>
      <p>Connect with third-party services</p>
    </div>
  </div>

  <div class="grid-cols-3">
    <div class="card">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 bg-gray-100 rounded flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/></svg>
        </div>
        <span class="font-medium">GitHub</span>
      </div>
      <p class="muted text-sm mb-3">CI/CD and repository integration</p>
      <button class="btn btn-sm btn-primary" type="button" data-settings-integration="GitHub">Connect</button>
    </div>
    <div class="card">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 bg-blue-100 rounded flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <span class="font-medium">Jenkins</span>
      </div>
      <p class="muted text-sm mb-3">Build automation and pipelines</p>
      <button class="btn btn-sm btn-secondary" type="button" data-settings-integration="Jenkins">Configure</button>
    </div>
    <div class="card">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 bg-purple-100 rounded flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <span class="font-medium">Slack</span>
      </div>
      <p class="muted text-sm mb-3">Notifications and alerts</p>
      <button class="btn btn-sm btn-primary" type="button" data-settings-integration="Slack">Connect</button>
</div>
  </div>
</div>
</body>
</html>
