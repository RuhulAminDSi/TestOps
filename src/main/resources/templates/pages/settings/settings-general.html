<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content settings-page">
  <div class="page-header">
    <div>
      <h1>General Settings</h1>
      <p>Configure general application settings</p>
    </div>
  </div>

  <div class="panel" id="settings-general-panel">
    <div class="panel-header">
      <h3>Application</h3>
    </div>
    <div class="form-group">
      <label class="label">Application Name</label>
      <input type="text" class="input" id="settings-general-app-name" value="AI QA Copilot">
    </div>
    <div class="form-group">
      <label class="label">Timezone</label>
      <select class="input" id="settings-general-timezone">
        <option>UTC</option>
        <option>America/New_York</option>
        <option>Europe/London</option>
        <option>Asia/Tokyo</option>
      </select>
    </div>
    <div class="form-group">
      <label class="label">Language</label>
      <select class="input" id="settings-general-language">
        <option>English</option>
        <option>Spanish</option>
        <option>French</option>
        <option>German</option>
      </select>
    </div>
    <button class="btn btn-primary" type="button" id="settings-general-save">Save Changes</button>
  </div>
</div>
</body>
</html>
