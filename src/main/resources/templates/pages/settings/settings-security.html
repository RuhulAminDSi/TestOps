<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content settings-page">
  <div class="page-header">
    <div>
      <h1>Security</h1>
      <p>Configure security settings</p>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Authentication</h3>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" checked> Enable two-factor authentication
        </label>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" checked> Require strong passwords
        </label>
      </div>
      <div class="form-group">
        <label class="label">Session Timeout (minutes)</label>
        <input type="number" class="input" value="30">
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Access Control</h3>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" checked> IP whitelist enabled
        </label>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox"> API key authentication
        </label>
      </div>
      <button class="btn btn-primary w-full">Save Security Settings</button>
    </div>
  </div>
</div>
</body>
</html>
