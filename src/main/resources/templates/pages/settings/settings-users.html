<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Users & Roles</h1>
      <p>Manage users and their roles</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add User
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Team Members</h3>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="font-medium">Admin User</span></td>
            <td>admin@example.com</td>
            <td><span class="chip">Admin</span></td>
            <td><span class="chip success">Active</span></td>
            <td><button class="btn btn-sm btn-ghost">Edit</button></td>
          </tr>
          <tr>
            <td><span class="font-medium">Test Engineer</span></td>
            <td>tester@example.com</td>
            <td><span class="chip">Tester</span></td>
            <td><span class="chip success">Active</span></td>
            <td><button class="btn btn-sm btn-ghost">Edit</button></td>
          </tr>
          <tr>
            <td><span class="font-medium">Viewer</span></td>
            <td>viewer@example.com</td>
            <td><span class="chip">Viewer</span></td>
            <td><span class="chip success">Active</span></td>
            <td><button class="btn btn-sm btn-ghost">Edit</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
