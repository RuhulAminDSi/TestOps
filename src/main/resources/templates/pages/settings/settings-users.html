<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Users & Roles</h1>
      <p>Manage users and their roles</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="settings-user-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add User
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Team Members</h3>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="settings-users-body"></tbody>
      </table>
    </div>
  </div>

  <div id="settings-user-modal" class="modal" role="dialog" aria-labelledby="settings-user-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('settings-user-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settings-user-title">User</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('settings-user-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="settings-user-form">
        <input type="hidden" id="settings-user-id">
        <div class="form-group">
          <label class="label" for="settings-user-name">Name</label>
          <input id="settings-user-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="settings-user-email">Email</label>
          <input id="settings-user-email" class="input" type="email" required>
        </div>
        <div class="form-group">
          <label class="label" for="settings-user-role">Role</label>
          <select id="settings-user-role" class="input">
            <option>Admin</option>
            <option>Tester</option>
            <option>Viewer</option>
          </select>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('settings-user-modal')">Cancel</button>
        <button type="submit" form="settings-user-form" class="btn btn-primary">Save User</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
