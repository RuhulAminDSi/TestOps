<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content settings-page">
  <div class="page-header">
    <div>
      <h1>Credentials</h1>
      <p>Manage API keys and credentials</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="settings-credential-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add Credential
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Saved Credentials</h3>
    </div>
    <ul class="list-rows" id="settings-credentials-list"></ul>
  </div>

  <div id="settings-credential-modal" class="modal" role="dialog" aria-labelledby="settings-credential-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('settings-credential-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settings-credential-title">Credential</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('settings-credential-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="settings-credential-form">
        <input type="hidden" id="settings-credential-id">
        <div class="form-group">
          <label class="label" for="settings-credential-name">Name</label>
          <input id="settings-credential-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="settings-credential-desc">Description</label>
          <input id="settings-credential-desc" class="input" type="text" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('settings-credential-modal')">Cancel</button>
        <button type="submit" form="settings-credential-form" class="btn btn-primary">Save Credential</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
