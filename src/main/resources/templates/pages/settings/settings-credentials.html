<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Credentials</h1>
      <p>Manage API keys and credentials</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add Credential
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Saved Credentials</h3>
    </div>
    <ul class="list-rows">
      <li>
        <div class="flex-1">
          <span class="font-medium">GitHub Token</span>
          <span class="muted text-xs">For CI/CD integration</span>
        </div>
        <span class="muted">••••••••</span>
        <button class="btn btn-sm btn-ghost">Edit</button>
      </li>
      <li>
        <div class="flex-1">
          <span class="font-medium">AWS Credentials</span>
          <span class="muted text-xs">For S3 storage</span>
        </div>
        <span class="muted">••••••••</span>
        <button class="btn btn-sm btn-ghost">Edit</button>
      </li>
      <li>
        <div class="flex-1">
          <span class="font-medium">OpenAI API Key</span>
          <span class="muted text-xs">For AI features</span>
        </div>
        <span class="muted">••••••••</span>
        <button class="btn btn-sm btn-ghost">Edit</button>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
