<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>AI Configuration</h1>
      <p>Configure AI models and behavior</p>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Model Settings</h3>
      </div>
      <div class="form-group">
        <label class="label">Default Model</label>
        <select class="input">
          <option>GPT-4</option>
          <option>GPT-3.5 Turbo</option>
          <option>Claude 3</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Temperature</label>
        <input type="range" class="input" min="0" max="1" step="0.1" value="0.7">
      </div>
      <div class="form-group">
        <label class="label">Max Tokens</label>
        <input type="number" class="input" value="2000">
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Capabilities</h3>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" checked> Enable test generation
        </label>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" checked> Enable query generation
        </label>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" checked> Enable code completion
        </label>
      </div>
      <button class="btn btn-primary w-full">Save Settings</button>
    </div>
  </div>
</div>
</body>
</html>
