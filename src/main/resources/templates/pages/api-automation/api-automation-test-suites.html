<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>API Test Suites</h1>
      <p>Group and run multiple API tests together</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="api-suite-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Test Suite
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Test Suites</h3>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Suite Name</th>
            <th>Tests</th>
            <th>Last Run</th>
            <th>Pass Rate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="api-suites-body"></tbody>
      </table>
    </div>
  </div>

  <div id="api-suite-modal" class="modal" role="dialog" aria-labelledby="api-suite-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('api-suite-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="api-suite-title">Test Suite</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('api-suite-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="api-suite-form">
        <input type="hidden" id="api-suite-id">
        <div class="form-group">
          <label class="label" for="api-suite-name">Suite Name</label>
          <input id="api-suite-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-suite-tests">Tests</label>
          <input id="api-suite-tests" class="input" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-suite-rate">Pass Rate</label>
          <input id="api-suite-rate" class="input" type="number" min="0" max="100" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('api-suite-modal')">Cancel</button>
        <button type="submit" form="api-suite-form" class="btn btn-primary">Save Suite</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
