<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Environment</h1>
      <p>Manage API environments and variables</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="input w-48">
        <option>Development</option>
        <option>Staging</option>
        <option>Production</option>
      </select>
      <button class="btn btn-primary" data-modal-toggle="api-environment-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add Variable
      </button>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Environments</h3>
      </div>
      <ul class="list-rows">
        <li>
          <div class="dot green"></div>
          <div class="flex-1">
            <span class="font-medium">Development</span>
            <span class="muted text-xs">Local testing</span>
          </div>
          <span class="chip success">Active</span>
        </li>
        <li>
          <div class="dot yellow"></div>
          <div class="flex-1">
            <span class="font-medium">Staging</span>
            <span class="muted text-xs">Pre-production</span>
          </div>
          <button class="btn btn-sm btn-ghost" type="button" data-api-environment-switch="Staging">Switch</button>
        </li>
        <li>
          <div class="dot gray"></div>
          <div class="flex-1">
            <span class="font-medium">Production</span>
            <span class="muted text-xs">Live environment</span>
          </div>
          <button class="btn btn-sm btn-ghost" type="button" data-api-environment-switch="Production">Switch</button>
        </li>
      </ul>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Current Variables</h3>
      </div>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Variable</th>
              <th>Value</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="api-environment-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="api-environment-modal" class="modal" role="dialog" aria-labelledby="api-environment-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('api-environment-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="api-environment-title">Environment Variable</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('api-environment-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="api-environment-form">
        <input type="hidden" id="api-environment-id">
        <div class="form-group">
          <label class="label" for="api-environment-key">Variable</label>
          <input id="api-environment-key" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-environment-value">Value</label>
          <input id="api-environment-value" class="input" type="text" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('api-environment-modal')">Cancel</button>
        <button type="submit" form="api-environment-form" class="btn btn-primary">Save Variable</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
