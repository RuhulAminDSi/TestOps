<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Schema Validation</h1>
      <p>Validate API responses against JSON schemas</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="api-schema-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Schema
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Total Schemas</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <p class="text-3xl">28</p>
    </div>
    <div class="stat-card" style="border-left: 3px solid #22c55e; background: rgba(34, 197, 94, 0.1);">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Valid</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg>
      </div>
      <p class="text-3xl">25</p>
    </div>
    <div class="stat-card" style="border-left: 3px solid #ef4444; background: rgba(239, 68, 68, 0.1);">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Failed</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg>
      </div>
      <p class="text-3xl">3</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Schema List</h3>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Schema Name</th>
            <th>Endpoint</th>
            <th>Last Validated</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="api-schemas-body"></tbody>
      </table>
    </div>
  </div>

  <div id="api-schema-modal" class="modal" role="dialog" aria-labelledby="api-schema-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('api-schema-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="api-schema-title">Schema</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('api-schema-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="api-schema-form">
        <input type="hidden" id="api-schema-id">
        <div class="form-group">
          <label class="label" for="api-schema-name">Schema Name</label>
          <input id="api-schema-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-schema-endpoint">Endpoint</label>
          <input id="api-schema-endpoint" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-schema-status">Status</label>
          <select id="api-schema-status" class="input">
            <option>Valid</option>
            <option>Failed</option>
          </select>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('api-schema-modal')">Cancel</button>
        <button type="submit" form="api-schema-form" class="btn btn-primary">Save Schema</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
