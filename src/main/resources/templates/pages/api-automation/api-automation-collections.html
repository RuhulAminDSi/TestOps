<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>API Collections</h1>
      <p>Organize and manage your API requests</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Import
      </button>
      <button class="btn btn-primary" data-modal-toggle="api-collection-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Collection
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>All Collections</h3>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Collection Name</th>
            <th>Requests</th>
            <th>Last Updated</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="api-collections-body"></tbody>
      </table>
    </div>
  </div>

  <div id="api-collection-modal" class="modal" role="dialog" aria-labelledby="api-collection-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('api-collection-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="api-collection-title">Collection</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('api-collection-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="api-collection-form">
        <input type="hidden" id="api-collection-id">
        <div class="form-group">
          <label class="label" for="api-collection-name">Collection Name</label>
          <input id="api-collection-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-collection-requests">Requests</label>
          <input id="api-collection-requests" class="input" type="number" min="0" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-collection-status">Status</label>
          <select id="api-collection-status" class="input">
            <option>Active</option>
            <option>Errors</option>
            <option>Draft</option>
          </select>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('api-collection-modal')">Cancel</button>
        <button type="submit" form="api-collection-form" class="btn btn-primary">Save Collection</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
