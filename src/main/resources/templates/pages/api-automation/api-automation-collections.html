<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>API Collections</h1>
      <p>Organize and manage your API requests</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Import
      </button>
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Collection
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>All Collections</h3>
    </div>
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Collection Name</th>
            <th>Requests</th>
            <th>Last Updated</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="font-medium">User API</span></td>
            <td>48</td>
            <td>Today, 2:30 PM</td>
            <td><span class="chip success">Active</span></td>
            <td>
              <button class="btn btn-sm btn-ghost">Run</button>
              <button class="btn btn-sm btn-ghost">Edit</button>
            </td>
          </tr>
          <tr>
            <td><span class="font-medium">Auth API</span></td>
            <td>12</td>
            <td>Yesterday</td>
            <td><span class="chip success">Active</span></td>
            <td>
              <button class="btn btn-sm btn-ghost">Run</button>
              <button class="btn btn-sm btn-ghost">Edit</button>
            </td>
          </tr>
          <tr>
            <td><span class="font-medium">Payment API</span></td>
            <td>25</td>
            <td>2 days ago</td>
            <td><span class="chip danger">Errors</span></td>
            <td>
              <button class="btn btn-sm btn-ghost">Run</button>
              <button class="btn btn-sm btn-ghost">Edit</button>
            </td>
          </tr>
          <tr>
            <td><span class="font-medium">Product API</span></td>
            <td>31</td>
            <td>3 days ago</td>
            <td><span class="chip success">Active</span></td>
            <td>
              <button class="btn btn-sm btn-ghost">Run</button>
              <button class="btn btn-sm btn-ghost">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
