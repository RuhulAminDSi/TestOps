<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Mock Server</h1>
      <p>Create and manage API mock endpoints</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="api-mock-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Create Mock
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Active Mocks</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
      </div>
      <p class="text-3xl">12</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Requests Today</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <p class="text-3xl">2,456</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Avg Latency</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <p class="text-3xl">45ms</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Mock Endpoints</h3>
    </div>
    <ul class="list-rows" id="api-mocks-list"></ul>
  </div>

  <div id="api-mock-modal" class="modal" role="dialog" aria-labelledby="api-mock-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('api-mock-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="api-mock-title">Mock Endpoint</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('api-mock-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="api-mock-form">
        <input type="hidden" id="api-mock-id">
        <div class="form-group">
          <label class="label" for="api-mock-method">Method</label>
          <select id="api-mock-method" class="input">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>DELETE</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label" for="api-mock-path">Path</label>
          <input id="api-mock-path" class="input" type="text" placeholder="/mock/example" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-mock-description">Description</label>
          <input id="api-mock-description" class="input" type="text" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('api-mock-modal')">Cancel</button>
        <button type="submit" form="api-mock-form" class="btn btn-primary">Save Mock</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
