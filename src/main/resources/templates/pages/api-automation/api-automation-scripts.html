<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>API Scripts</h1>
      <p>Write custom pre-request and test scripts</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="api-script-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Script
      </button>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Saved Scripts</h3>
      </div>
      <ul class="list-rows" id="api-scripts-list"></ul>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3 id="api-script-editor-title">Script Editor</h3>
      </div>
      <div class="form-group">
        <label class="label">Script Type</label>
        <select class="input" id="api-script-editor-type">
          <option>Pre-request</option>
          <option>Test</option>
          <option>Post-response</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Script</label>
        <textarea class="input font-mono" id="api-script-editor-content" rows="12" placeholder="// Write your JavaScript here
const token = pm.environment.get('auth_token');
pm.request.headers.add({
  key: 'Authorization',
  value: 'Bearer ' + token
});"></textarea>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-secondary flex-1" type="button" id="api-script-test">Test</button>
        <button class="btn btn-primary flex-1" type="button" id="api-script-save">Save</button>
      </div>
    </div>
  </div>

  <div id="api-script-modal" class="modal" role="dialog" aria-labelledby="api-script-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('api-script-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="api-script-title">Script</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('api-script-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="api-script-form">
        <input type="hidden" id="api-script-id">
        <div class="form-group">
          <label class="label" for="api-script-name">Script Name</label>
          <input id="api-script-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-script-type">Script Type</label>
          <select id="api-script-type" class="input">
            <option>Pre-request</option>
            <option>Test</option>
            <option>Post-response</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label" for="api-script-content">Script</label>
          <textarea id="api-script-content" class="input font-mono" rows="8" required></textarea>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('api-script-modal')">Cancel</button>
        <button type="submit" form="api-script-form" class="btn btn-primary">Save Script</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
