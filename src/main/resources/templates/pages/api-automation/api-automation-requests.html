<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>API Requests</h1>
      <p>Build and test API endpoints</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="input w-48">
        <option>All Methods</option>
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>DELETE</option>
      </select>
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Request
      </button>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Request List</h3>
      </div>
      <ul class="list-rows">
        <li>
          <span class="badge badge-get">GET</span>
          <div class="flex-1">
            <span>Get Users</span>
            <span class="muted text-xs">/api/users</span>
          </div>
          <span class="chip success">200</span>
        </li>
        <li>
          <span class="badge badge-post">POST</span>
          <div class="flex-1">
            <span>Create User</span>
            <span class="muted text-xs">/api/users</span>
          </div>
          <span class="chip success">201</span>
        </li>
        <li>
          <span class="badge badge-put">PUT</span>
          <div class="flex-1">
            <span>Update User</span>
            <span class="muted text-xs">/api/users/:id</span>
          </div>
          <span class="chip success">200</span>
        </li>
        <li>
          <span class="badge badge-delete">DEL</span>
          <div class="flex-1">
            <span>Delete User</span>
            <span class="muted text-xs">/api/users/:id</span>
          </div>
          <span class="chip success">204</span>
        </li>
      </ul>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Request Builder</h3>
      </div>
      <div class="form-group">
        <label class="label">Method</label>
        <select class="input">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">URL</label>
        <input type="text" class="input" placeholder="https://api.example.com/endpoint">
      </div>
      <div class="form-group">
        <label class="label">Headers</label>
        <textarea class="input" rows="3" placeholder="Content-Type: application/json"></textarea>
      </div>
      <div class="form-group">
        <label class="label">Body</label>
        <textarea class="input font-mono" rows="5" placeholder="{}"></textarea>
      </div>
      <button class="btn btn-primary w-full">Send Request</button>
    </div>
  </div>
</div>
</body>
</html>
