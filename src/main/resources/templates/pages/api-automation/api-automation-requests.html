<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>API Requests</h1>
      <p>Build and test API endpoints</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="input w-48">
        <option>All Methods</option>
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>DELETE</option>
      </select>
      <button class="btn btn-primary" data-modal-toggle="api-request-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Request
      </button>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Request List</h3>
      </div>
      <ul class="list-rows" id="api-requests-list"></ul>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Request Builder</h3>
      </div>
      <div class="form-group">
        <label class="label">Method</label>
        <select class="input" id="api-request-builder-method">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">URL</label>
        <input type="text" class="input" id="api-request-builder-url" placeholder="https://api.example.com/endpoint">
      </div>
      <div class="form-group">
        <label class="label">Headers</label>
        <textarea class="input" id="api-request-builder-headers" rows="3" placeholder="Content-Type: application/json"></textarea>
      </div>
      <div class="form-group">
        <label class="label">Body</label>
        <textarea class="input font-mono" id="api-request-builder-body" rows="5" placeholder="{}"></textarea>
      </div>
      <button class="btn btn-primary w-full" type="button" id="api-send-request">Send Request</button>
    </div>
  </div>

  <div id="api-request-modal" class="modal" role="dialog" aria-labelledby="api-request-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('api-request-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="api-request-title">Request</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('api-request-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="api-request-form">
        <input type="hidden" id="api-request-id">
        <div class="form-group">
          <label class="label" for="api-request-name">Request Name</label>
          <input id="api-request-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-request-method">Method</label>
          <select id="api-request-method" class="input">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>DELETE</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label" for="api-request-path">Path</label>
          <input id="api-request-path" class="input" type="text" placeholder="/api/example" required>
        </div>
        <div class="form-group">
          <label class="label" for="api-request-status">Expected Status</label>
          <input id="api-request-status" class="input" type="number" min="100" max="599" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('api-request-modal')">Cancel</button>
        <button type="submit" form="api-request-form" class="btn btn-primary">Save Request</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
