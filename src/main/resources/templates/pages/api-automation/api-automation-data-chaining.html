<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Data Chaining</h1>
      <p>Link API responses to subsequent requests</p>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Chain Rules</h3>
      </div>
      <ul class="list-rows">
        <li>
          <div class="flex-1">
            <span>User Login -> Get Profile</span>
            <span class="muted text-xs">Extract: token, userId</span>
          </div>
          <button class="btn btn-sm btn-ghost">Edit</button>
        </li>
        <li>
          <div class="flex-1">
            <span>Create Order -> Get Order Details</span>
            <span class="muted text-xs">Extract: orderId</span>
          </div>
          <button class="btn btn-sm btn-ghost">Edit</button>
        </li>
        <li>
          <div class="flex-1">
            <span>Search Products -> Add to Cart</span>
            <span class="muted text-xs">Extract: productIds</span>
          </div>
          <button class="btn btn-sm btn-ghost">Edit</button>
        </li>
      </ul>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Create Chain</h3>
      </div>
      <div class="form-group">
        <label class="label">Chain Name</label>
        <input type="text" class="input" placeholder="My API Chain">
      </div>
      <div class="form-group">
        <label class="label">Source Request</label>
        <select class="input">
          <option>GET /api/users/login</option>
          <option>POST /api/orders</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Extract Variables</label>
        <textarea class="input" rows="3" placeholder="token: response.body.token"></textarea>
      </div>
      <button class="btn btn-primary w-full">Save Chain</button>
    </div>
  </div>
</div>
</body>
</html>
