<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>AI Query Generator</h1>
      <p>Generate SQL queries using AI</p>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Describe Your Query</h3>
      </div>
      <div class="form-group">
        <label class="label">Natural Language Description</label>
        <textarea class="input" rows="4" placeholder="Find all users who placed orders in the last 30 days with total value over $100"></textarea>
      </div>
      <button class="btn btn-primary w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        Generate Query
      </button>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Generated SQL</h3>
      </div>
      <div class="form-group">
        <textarea class="input font-mono" rows="8" placeholder="-- Generated SQL will appear here..."></textarea>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-secondary flex-1">Copy</button>
        <button class="btn btn-primary flex-1">Execute</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
