<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Data Validation</h1>
      <p>Validate database data quality and integrity</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Run Validation
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card" style="border-left: 3px solid #22c55e; background: rgba(34, 197, 94, 0.1);">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Valid Records</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg>
      </div>
      <p class="text-3xl">12,456</p>
    </div>
    <div class="stat-card" style="border-left: 3px solid #ef4444; background: rgba(239, 68, 68, 0.1);">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Invalid</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg>
      </div>
      <p class="text-3xl">23</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Validation Rules</h3>
    </div>
    <ul class="list-rows">
      <li>
        <span class="dot green"></span>
        <div class="flex-1">
          <span class="font-medium">Email Format</span>
          <span class="muted text-xs">users table - 0 errors</span>
        </div>
        <span class="chip success">Passed</span>
      </li>
      <li>
        <span class="dot green"></span>
        <div class="flex-1">
          <span class="font-medium">Required Fields</span>
          <span class="muted text-xs">orders table - 0 errors</span>
        </div>
        <span class="chip success">Passed</span>
      </li>
      <li>
        <span class="dot red"></span>
        <div class="flex-1">
          <span class="font-medium">Foreign Keys</span>
          <span class="muted text-xs">products table - 5 errors</span>
        </div>
        <span class="chip danger">Failed</span>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
