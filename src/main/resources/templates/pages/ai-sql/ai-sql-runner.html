<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>SQL Runner</h1>
      <p>Execute SQL queries directly on your database</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="input w-48">
        <option>Production DB</option>
        <option>Staging DB</option>
        <option>Test DB</option>
      </select>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Query Editor</h3>
      </div>
      <div class="form-group">
        <textarea class="input font-mono" rows="10" placeholder="SELECT * FROM users WHERE active = true LIMIT 10;"></textarea>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-primary flex-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Execute
        </button>
        <button class="btn btn-secondary">Clear</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Results</h3>
        <span class="badge-soft">0 rows</span>
      </div>
      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Column</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="2" class="muted text-center p-4">No results yet. Execute a query to see results.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
