<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Data Migration</h1>
      <p>Migrate data between databases</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="ai-sql-migration-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Migration
      </button>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Migration Jobs</h3>
      </div>
      <ul class="list-rows" id="ai-sql-migrations-list"></ul>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Create Migration</h3>
      </div>
      <div class="form-group">
        <label class="label">Source Database</label>
        <select class="input" id="ai-sql-migration-source">
          <option>Production</option>
          <option>Staging</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Target Database</label>
        <select class="input" id="ai-sql-migration-target">
          <option>Staging</option>
          <option>Backup</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Table(s)</label>
        <input type="text" class="input" id="ai-sql-migration-tables" placeholder="users, orders, products">
      </div>
      <button class="btn btn-primary w-full" type="button" id="ai-sql-start-migration">Start Migration</button>
    </div>
  </div>

  <div id="ai-sql-migration-modal" class="modal" role="dialog" aria-labelledby="ai-sql-migration-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('ai-sql-migration-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="ai-sql-migration-title">Migration Job</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('ai-sql-migration-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="ai-sql-migration-form">
        <input type="hidden" id="ai-sql-migration-id">
        <div class="form-group">
          <label class="label" for="ai-sql-migration-name">Job Name</label>
          <input id="ai-sql-migration-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="ai-sql-migration-records">Records</label>
          <input id="ai-sql-migration-records" class="input" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label class="label" for="ai-sql-migration-status">Status</label>
          <select id="ai-sql-migration-status" class="input">
            <option>Completed</option>
            <option>Running</option>
            <option>Pending</option>
          </select>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('ai-sql-migration-modal')">Cancel</button>
        <button type="submit" form="ai-sql-migration-form" class="btn btn-primary">Save Migration</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
