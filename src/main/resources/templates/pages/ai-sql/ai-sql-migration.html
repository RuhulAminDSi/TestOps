<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Data Migration</h1>
      <p>Migrate data between databases</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Migration
      </button>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Migration Jobs</h3>
      </div>
      <ul class="list-rows">
        <li>
          <div class="dot green"></div>
          <div class="flex-1">
            <span class="font-medium">Users to Staging</span>
            <span class="muted text-xs">Completed - 1,234 records</span>
          </div>
          <span class="chip success">Completed</span>
        </li>
        <li>
          <div class="dot yellow"></div>
          <div class="flex-1">
            <span class="font-medium">Orders Archive</span>
            <span class="muted text-xs">In Progress - 5,678 records</span>
          </div>
          <span class="chip warning">Running</span>
        </li>
      </ul>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Create Migration</h3>
      </div>
      <div class="form-group">
        <label class="label">Source Database</label>
        <select class="input">
          <option>Production</option>
          <option>Staging</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Target Database</label>
        <select class="input">
          <option>Staging</option>
          <option>Backup</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Table(s)</label>
        <input type="text" class="input" placeholder="users, orders, products">
      </div>
      <button class="btn btn-primary w-full">Start Migration</button>
    </div>
  </div>
</div>
</body>
</html>
