<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>SQL Scripts</h1>
      <p>Manage and organize your SQL scripts</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Script
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Saved Scripts</h3>
    </div>
    <ul class="list-rows">
      <li>
        <div class="flex-1">
          <span class="font-medium">User Analytics Query</span>
          <span class="muted text-xs">SELECT with JOINs</span>
        </div>
        <button class="btn btn-sm btn-ghost">Run</button>
      </li>
      <li>
        <div class="flex-1">
          <span class="font-medium">Order Summary</span>
          <span class="muted text-xs">Aggregation query</span>
        </div>
        <button class="btn btn-sm btn-ghost">Run</button>
      </li>
      <li>
        <div class="flex-1">
          <span class="font-medium">Product Migration</span>
          <span class="muted text-xs">INSERT/UPDATE</span>
        </div>
        <button class="btn btn-sm btn-ghost">Run</button>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
