<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>SQL Scripts</h1>
      <p>Manage and organize your SQL scripts</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" data-modal-toggle="ai-sql-script-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Script
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Saved Scripts</h3>
    </div>
    <ul class="list-rows" id="ai-sql-scripts-list"></ul>
  </div>

  <div id="ai-sql-script-modal" class="modal" role="dialog" aria-labelledby="ai-sql-script-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('ai-sql-script-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="ai-sql-script-title">SQL Script</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('ai-sql-script-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="ai-sql-script-form">
        <input type="hidden" id="ai-sql-script-id">
        <div class="form-group">
          <label class="label" for="ai-sql-script-name">Script Name</label>
          <input id="ai-sql-script-name" class="input" type="text" required>
        </div>
        <div class="form-group">
          <label class="label" for="ai-sql-script-type">Type</label>
          <input id="ai-sql-script-type" class="input" type="text" placeholder="SELECT with JOINs" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('ai-sql-script-modal')">Cancel</button>
        <button type="submit" form="ai-sql-script-form" class="btn btn-primary">Save Script</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
