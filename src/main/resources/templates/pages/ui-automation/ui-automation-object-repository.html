<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Object Repository</h1>
      <p>Manage reusable test objects</p>
    </div>
    <div class="flex items-center gap-3">
      <input type="text" class="input w-64" placeholder="Search objects...">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add Object
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Total Objects</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16.5 9.4-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      </div>
      <p class="text-3xl">89</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Pages</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/></svg>
      </div>
      <p class="text-3xl">8</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Page Objects</h3>
    </div>
    <ul class="list-rows">
      <li>
        <div class="dot blue"></div>
        <div class="flex-1">
          <span>LoginPage</span>
          <span class="muted text-xs">12 objects - Last updated: Today</span>
        </div>
        <button class="btn btn-sm">Edit</button>
      </li>
      <li>
        <div class="dot blue"></div>
        <div class="flex-1">
          <span>CheckoutPage</span>
          <span class="muted text-xs">18 objects - Last updated: Yesterday</span>
        </div>
        <button class="btn btn-sm">Edit</button>
      </li>
      <li>
        <div class="dot blue"></div>
        <div class="flex-1">
          <span>PaymentPage</span>
          <span class="muted text-xs">15 objects - Last updated: 2 days ago</span>
        </div>
        <button class="btn btn-sm">Edit</button>
      </li>
      <li>
        <div class="dot blue"></div>
        <div class="flex-1">
          <span>HomePage</span>
          <span class="muted text-xs">10 objects - Last updated: 3 days ago</span>
        </div>
        <button class="btn btn-sm">Edit</button>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
