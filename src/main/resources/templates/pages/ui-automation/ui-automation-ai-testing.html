<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>AI Testing</h1>
      <p>Generate Playwright test scripts using natural language instructions</p>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Target Application</h3>
      </div>
      <form id="ai-test-form" class="form-stack">
        <div class="form-group">
          <label>URL</label>
          <input type="url" id="test-url" placeholder="https://example.com" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Username (optional)</label>
            <input type="text" id="test-username" placeholder="Username" />
          </div>
          <div class="form-group">
            <label>Password (optional)</label>
            <input type="password" id="test-password" placeholder="Password" />
          </div>
        </div>
        <div class="form-group">
          <label>Test Instruction</label>
          <textarea id="test-instruction" rows="3" placeholder="e.g., Login to the system with valid credentials and verify the dashboard loads correctly" required></textarea>
        </div>
        <div class="form-group">
          <label>AI Provider</label>
          <select id="ai-provider">
            <option value="opencode">opencode AI</option>
            <option value="openai">OpenAI GPT-4</option>
            <option value="ollama">Ollama Local</option>
            <option value="claude">Anthropic Claude</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" id="generate-btn">Generate & Run Test</button>
          <button type="button" class="btn btn-secondary" id="analyze-btn">Analyze Page</button>
        </div>
      </form>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <h3>Terminal Output</h3>
        <button class="btn btn-sm btn-ghost" id="clear-terminal">Clear</button>
      </div>
      <div id="terminal-output" class="terminal">
        <div class="terminal-line">> AI Testing ready</div>
        <div class="terminal-line">> Enter a URL and test instruction to generate tests</div>
      </div>
    </div>
  </div>

  <div class="panel mt-4">
    <div class="panel-header">
      <h3>Generated Scripts</h3>
      <input type="text" class="input w-48" placeholder="Search scripts..." id="script-search-input" oninput="filterScripts(this.value)">
    </div>
    <div id="scripts-list" class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Script Name</th>
            <th>URL</th>
            <th>AI Provider</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="scripts-tbody">
          <tr><td colspan="6" class="text-center muted">No scripts generated yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="edit-script-modal" class="modal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
    <div class="modal-content" style="background:var(--bg-primary); max-width:600px; margin:10% auto; padding:24px; border-radius:8px;">
      <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:16px;">
        <h3>Edit Script</h3>
        <button onclick="closeEditModal()" style="background:none; border:none; cursor:pointer; font-size:24px;">&times;</button>
      </div>
      <input type="hidden" id="edit-script-id">
      <div class="form-group" style="margin-bottom:16px;">
        <label style="display:block; margin-bottom:4px;">Script Name</label>
        <input type="text" id="edit-script-name" class="input" style="width:100%;">
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label style="display:block; margin-bottom:4px;">Script Content</label>
        <textarea id="edit-script-content" class="input" style="width:100%; height:300px; font-family:monospace;"></textarea>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button onclick="closeEditModal()" class="btn btn-ghost">Cancel</button>
        <button onclick="saveScriptChanges()" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
  (function() {
    var terminal = document.getElementById('terminal-output');
    var generateBtn = document.getElementById('generate-btn');
    var analyzeBtn = document.getElementById('analyze-btn');
    var clearBtn = document.getElementById('clear-terminal');
    
    window.log = function(msg, type) {
      type = type || 'info';
      var line = document.createElement('div');
      line.className = 'terminal-line terminal-' + type;
      line.textContent = '> ' + msg;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    };
    
    function clearTerminal() {
      terminal.innerHTML = '';
      window.log('Terminal cleared');
    }
    
    generateBtn.addEventListener('click', function() {
      var url = document.getElementById('test-url').value;
      var instruction = document.getElementById('test-instruction').value;
      var provider = document.getElementById('ai-provider').value;
      var username = document.getElementById('test-username').value;
      var password = document.getElementById('test-password').value;
      
      if (!url || !instruction) {
        window.log('Error: URL and instruction are required', 'error');
        return;
      }
      
      window.log('Generating test for: ' + url);
      window.log('Instruction: ' + instruction);
      if (username) window.log('Using credentials for: ' + username);
      generateBtn.disabled = true;
      generateBtn.textContent = 'Generating...';
      
      fetch('/api/ai-test/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url, instruction: instruction, aiProvider: provider, username: username, password: password, autoExecute: true })
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.success) {
          window.log('Script generated: ' + result.scriptName, 'success');
          window.log('Saved to: ' + result.filePath);
          if (result.executionStatus) {
            window.log('Execution status: ' + result.executionStatus);
            if (result.passedTests) window.log('Passed: ' + result.passedTests);
            if (result.skippedTests) window.log('Skipped: ' + result.skippedTests + ' (npx not available)', 'info');
          }
          window.loadScripts();
        } else {
          window.log('Error: ' + result.message, 'error');
        }
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate & Run Test';
      })
      .catch(function(err) {
        window.log('Error: ' + err.message, 'error');
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate & Run Test';
      });
    });
    
    analyzeBtn.addEventListener('click', function() {
      var url = document.getElementById('test-url').value;
      if (!url) {
        window.log('Error: Enter a URL first', 'error');
        return;
      }
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = 'Analyzing...';
      window.log('Analyzing page: ' + url);
      
      fetch('/api/ai-test/analyze?url=' + encodeURIComponent(url))
      .then(function(r) { return r.json(); })
      .then(function(result) {
        window.log('Page title: ' + (result.title || 'N/A'));
        window.log('Elements found: ' + (result.elements || 0));
      })
      .catch(function(err) {
        window.log('Analysis error: ' + err.message, 'error');
      })
      .then(function() {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = 'Analyze Page';
      });
    });
    
    clearBtn.addEventListener('click', clearTerminal);
    
    window.loadScripts = function() {
      fetch('/api/ai-test/scripts')
      .then(function(r) { return r.json(); })
      .then(function(scripts) {
        var tbody = document.getElementById('scripts-tbody');
        if (!scripts || scripts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center muted">No scripts generated yet</td></tr>';
          return;
        }
        tbody.innerHTML = scripts.map(function(s) {
          return '<tr>' +
            '<td>' + s.name + '</td>' +
            '<td class="text-sm">' + s.url + '</td>' +
            '<td>' + s.aiProvider + '</td>' +
            '<td><span class="chip ' + (s.status === 'EXECUTED' ? 'success' : s.status === 'FAILED' ? 'error' : 'soft') + '">' + s.status + '</span></td>' +
            '<td class="text-sm">' + (s.createdAt ? new Date(s.createdAt).toLocaleString() : '') + '</td>' +
            '<td>' +
              '<button class="btn btn-sm btn-primary" onclick="window.runScript(' + s.id + ')">Run</button> ' +
              '<button class="btn btn-sm btn-ghost" onclick="window.editScript(' + s.id + ')">Edit</button> ' +
              '<button class="btn btn-sm btn-danger" onclick="window.deleteScript(' + s.id + ')">Del</button>' +
            '</td>' +
          '</tr>';
        }).join('');
      })
      .catch(function(err) {
        window.log('Error loading scripts: ' + err.message, 'error');
      });
    };
    
    window.runScript = function(id) {
      window.log('Running script #' + id);
      fetch('/api/ai-test/run/' + id, { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        window.log('Execution status: ' + result.status);
        if (result.passedTests) window.log('Passed: ' + result.passedTests);
        window.loadScripts();
      })
      .catch(function(err) {
        window.log('Run error: ' + err.message, 'error');
      });
    };
    
    window.deleteScript = function(id) {
      if (!confirm('Delete this script?')) return;
      window.log('Deleting script #' + id);
      fetch('/api/ai-test/scripts/' + id, { method: 'DELETE' })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        window.log('Script deleted', 'success');
        window.loadScripts();
      })
      .catch(function(err) {
        window.log('Delete error: ' + err.message, 'error');
      });
    };
    
    window.editScript = function(id) {
      window.log('Loading script #' + id + ' for edit...');
      fetch('/api/ai-test/scripts/' + id)
      .then(function(r) { return r.json(); })
      .then(function(s) {
        document.getElementById('edit-script-id').value = s.id;
        document.getElementById('edit-script-name').value = s.name;
        document.getElementById('edit-script-content').value = s.content || '';
        document.getElementById('edit-script-modal').style.display = 'flex';
      })
      .catch(function(err) {
        window.log('Load error: ' + err.message, 'error');
      });
    };
    
    window.closeEditModal = function() {
      document.getElementById('edit-script-modal').style.display = 'none';
    };
    
    window.saveScriptChanges = function() {
      var id = document.getElementById('edit-script-id').value;
      var name = document.getElementById('edit-script-name').value;
      var content = document.getElementById('edit-script-content').value;
      
      window.log('Saving script #' + id + '...');
      fetch('/api/ai-test/scripts/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, content: content })
      })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        window.log('Script saved', 'success');
        window.closeEditModal();
        window.loadScripts();
      })
      .catch(function(err) {
        window.log('Save error: ' + err.message, 'error');
      });
    };
    
    window.filterScripts = function(query) {
      query = query.toLowerCase().trim();
      var rows = document.querySelectorAll('#scripts-tbody tr');
      for (var i = 0; i < rows.length; i++) {
        var text = rows[i].textContent.toLowerCase();
        rows[i].style.display = (query === '' || text.indexOf(query) !== -1) ? '' : 'none';
      }
    };
    
    window.loadScripts();
  })();
  </script>
</div>
</body>
</html>
