<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Test Suites</h1>
      <p>Organize tests into suites</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="input w-48" id="suite-filter">
        <option value="">All Suites</option>
        <option th:each="suite : ${testSuites}" th:value="${suite.id}" th:text="${suite.name}">Suite</option>
      </select>
      <button class="btn btn-primary" data-modal-toggle="new-suite-modal" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Suite
      </button>
    </div>
  </div>

  <div id="new-suite-modal" class="modal" role="dialog" aria-labelledby="new-suite-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('new-suite-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="new-suite-title">Create New Test Suite</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('new-suite-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="new-suite-form">
        <div class="form-group">
          <label class="label" for="suite-name">Suite Name</label>
          <input type="text" id="suite-name" name="name" class="input" placeholder="e.g., Smoke Tests" required>
        </div>
        <div class="form-group">
          <label class="label" for="suite-description">Description</label>
          <textarea id="suite-description" name="description" class="input" rows="3" placeholder="Optional"></textarea>
        </div>
        <div class="form-group">
          <label class="label" for="suite-project">Project</label>
          <select id="suite-project" name="projectId" class="input" required>
            <option value="" disabled selected>Select project</option>
            <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.name}">Project</option>
          </select>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('new-suite-modal')">Cancel</button>
        <button type="submit" form="new-suite-form" class="btn btn-primary">Create Suite</button>
      </div>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Total Suites</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      </div>
      <p class="text-3xl">12</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Tests in Suites</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
      </div>
      <p class="text-3xl">142</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Test Suites</h3>
    </div>
    <ul class="list-rows">
      <th:block th:if="${testSuites != null and not #lists.isEmpty(testSuites)}">
        <li class="suite-item" th:each="suite : ${testSuites}" th:attr="data-suite-id=${suite.id}">
          <div class="dot green"></div>
          <div class="flex-1">
            <span th:text="${suite.name}">Suite Name</span>
            <span class="muted text-xs" th:text="${suite.description != null and !suite.description.isBlank() ? suite.description : 'No description'}">No description</span>
          </div>
        </li>
      </th:block>
      <th:block th:unless="${testSuites != null and not #lists.isEmpty(testSuites)}">
        <li>
          <div class="flex-1">
            <span class="muted">No test suites yet. Create one to get started.</span>
          </div>
        </li>
      </th:block>
    </ul>
  </div>
</div>
</body>
</html>
