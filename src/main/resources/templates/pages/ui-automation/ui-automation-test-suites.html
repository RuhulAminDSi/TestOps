<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Test Suites</h1>
      <p>Organize tests into suites</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="input w-48">
        <option>All Suites</option>
        <option>Smoke Tests</option>
        <option>Regression</option>
        <option>Full Suite</option>
      </select>
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Suite
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Total Suites</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      </div>
      <p class="text-3xl">12</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Tests in Suites</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
      </div>
      <p class="text-3xl">142</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Test Suites</h3>
    </div>
    <ul class="list-rows">
      <li>
        <div class="dot green"></div>
        <div class="flex-1">
          <span>Smoke Tests</span>
          <span class="muted text-xs">15 tests - Last run: Today, 11:00 AM</span>
        </div>
        <span class="chip success">15 passed</span>
      </li>
      <li>
        <div class="dot yellow"></div>
        <div class="flex-1">
          <span>Regression Suite</span>
          <span class="muted text-xs">45 tests - Last run: Today, 10:00 AM</span>
        </div>
        <span class="chip warning">42 passed</span>
      </li>
      <li>
        <div class="dot green"></div>
        <div class="flex-1">
          <span>Full Suite</span>
          <span class="muted text-xs">142 tests - Last run: Yesterday</span>
        </div>
        <span class="chip success">138 passed</span>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
