<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content" style="padding: 0; height: calc(100vh - 64px); display: flex; flex-direction: column;">
  <div class="scripts-layout">
    <!-- Left Sidebar: Script List -->
    <aside class="scripts-sidebar">
      <div class="sidebar-header">
        <input type="text" class="input" placeholder="Search scripts..." id="script-search">
      </div>
      <ul class="script-list" id="script-list">
        <th:block th:if="${scripts != null and not #lists.isEmpty(scripts)}">
          <li class="script-item" th:each="script : ${scripts}" th:data-script-id="${script.id}" th:data-content="${script.content}" th:data-language="${script.language}" onclick="selectScript(this)">
            <div class="script-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
            </div>
            <div class="script-info">
              <span class="script-name" th:text="${script.name}">Script Name</span>
              <span class="script-status" th:classappend="${script.lastStatus == 'Passed' ? 'pass' : (script.lastStatus == 'Failed' ? 'fail' : 'not-run')}" th:text="${script.lastStatus != null ? script.lastStatus : 'Not Run'}">Not Run</span>
            </div>
          </li>
        </th:block>
        <th:block th:unless="${scripts != null and not #lists.isEmpty(scripts)}">
          <li class="script-item" data-script-id="0">
            <div class="script-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
            </div>
            <div class="script-info">
              <span class="script-name">login.spec.js</span>
              <span class="script-status not-run">Not Run</span>
            </div>
          </li>
        </th:block>
      </ul>
      <button class="btn btn-primary w-full" style="margin: 12px; width: calc(100% - 24px);" data-modal-toggle="new-script-modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New Script
      </button>
    </aside>

    <!-- Main Content -->
    <main class="scripts-main">
      <!-- Toolbar -->
      <div class="scripts-toolbar">
        <div class="toolbar-left">
          <span class="file-name" id="current-script-name">Select a script</span>
          <span class="unsaved-indicator" id="unsaved-indicator" style="display: none;">●</span>
        </div>
        <div class="toolbar-center">
          <button class="btn btn-sm btn-primary" id="run-btn" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Run
          </button>
          <button class="btn btn-sm btn-ghost" id="stop-btn" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
            Stop
          </button>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-sm btn-ghost" id="clear-logs-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
            Clear
          </button>
          <button class="btn btn-sm btn-ghost" id="format-btn" title="Format Code">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10H3"/><path d="M21 6H3"/><path d="M21 14H3"/><path d="M21 18H3"/></svg>
            Format
          </button>
          <button class="btn btn-sm btn-primary" id="save-btn" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save
          </button>
        </div>
      </div>

      <!-- Editor Area -->
      <div class="scripts-editor" id="code-editor">
        <div class="editor-line-numbers" id="line-numbers">1</div>
        <textarea class="editor-textarea" id="editor-textarea" spellcheck="false" placeholder="Select or create a script to start editing..."></textarea>
      </div>

      <!-- Logs Panel -->
      <div class="logs-panel">
        <div class="logs-header">
          <span class="logs-title">Live Logs</span>
          <button class="btn btn-sm btn-ghost" id="copy-logs-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
        <div class="logs-content" id="logs-content">
          <div class="log-entry info">[12:00:00] Ready to run tests...</div>
        </div>
      </div>
    </main>

    <!-- Right Panel: Results -->
    <aside class="scripts-results" id="results-panel">
      <div class="results-header">
        <h3>Results</h3>
      </div>
      <div class="results-content">
        <div class="result-status" id="result-status">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>NO RUN</span>
        </div>
        <div class="result-stats">
          <div class="stat-item">
            <span class="stat-label">Duration</span>
            <span class="stat-value" id="execution-time">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Steps</span>
            <span class="stat-value" id="step-count">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Retries</span>
            <span class="stat-value">0</span>
          </div>
        </div>
        <div class="artifacts-section">
          <h4>Artifacts</h4>
          <div class="artifact-grid">
            <div class="artifact-item disabled" id="screenshot-thumbnail">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>No artifacts</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- New Script Modal -->
  <div id="new-script-modal" class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('new-script-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Create New Script</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('new-script-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="new-script-form">
        <div class="form-group">
          <label class="label" for="script-name">Script Name</label>
          <input type="text" id="script-name" name="name" class="input" placeholder="e.g., login.spec.js" required>
        </div>
        <div class="form-group">
          <label class="label" for="script-language">Language</label>
          <select id="script-language" name="language" class="input">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label" for="script-project">Project</label>
          <select id="script-project" name="projectId" class="input">
            <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.name}">Project Name</option>
          </select>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('new-script-modal')">Cancel</button>
        <button type="submit" form="new-script-form" class="btn btn-primary">Create Script</button>
      </div>
    </div>
  </div>

  <!-- Edit Script Modal -->
  <div id="edit-script-modal" class="modal" role="dialog" aria-labelledby="edit-modal-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('edit-script-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="edit-modal-title">Edit Script</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('edit-script-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form class="modal-body" id="edit-script-form">
        <input type="hidden" id="edit-script-id" name="id">
        <div class="form-group">
          <label class="label" for="edit-script-name">Script Name</label>
          <input type="text" id="edit-script-name" name="name" class="input" required>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('edit-script-modal')">Cancel</button>
        <button type="button" class="btn btn-danger" onclick="openDeleteScriptModal()">Delete</button>
        <button type="submit" form="edit-script-form" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Delete Script Modal -->
  <div id="delete-script-modal" class="modal" role="dialog" aria-labelledby="delete-modal-title" aria-modal="true" data-modal>
    <div class="modal-backdrop" onclick="closeModal('delete-script-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="delete-modal-title">Delete Script</h2>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('delete-script-modal')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="delete-script-name"></strong>?</p>
        <p class="muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('delete-script-modal')">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-script-btn">Delete</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
