<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>AI Testing</h1>
      <p>AI-powered test generation and optimization</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        Generate Tests
      </button>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>AI Capabilities</h3>
      </div>
      <div class="action-stack">
        <button class="action-card">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Auto-generate Test Cases
        </button>
        <button class="action-card">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="M4 12V6a2 2 0 0 1 2-2h12v8"/></svg>
          Smart Element Selection
        </button>
        <button class="action-card">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          Flakiness Detection
        </button>
        <button class="action-card">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M12 9v4"/><path d="M10 11h4"/></svg>
          Code Optimization
        </button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h3>Recent AI Generations</h3>
        <span class="badge-soft">5 items</span>
      </div>
      <ul class="list-rows">
        <li>
          <div class="dot green"></div>
          <div class="flex-1">
            <span>Checkout Flow Tests</span>
            <span class="muted text-xs">8 tests generated - Today, 10:00 AM</span>
          </div>
          <span class="chip success">completed</span>
        </li>
        <li>
          <div class="dot green"></div>
          <div class="flex-1">
            <span>Login Page Tests</span>
            <span class="muted text-xs">5 tests generated - Yesterday</span>
          </div>
          <span class="chip success">completed</span>
        </li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
