<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Scripts</h1>
      <p>Manage your test scripts</p>
    </div>
    <button class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      New Script
    </button>
  </div>

  <div class="flex gap-3 mb-6">
    <div class="relative flex-1">
      <svg class="absolute" style="left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--gray-500);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search scripts..." class="input w-full" style="padding-left: 40px;" />
    </div>
    <select class="input">
      <option value="">All Types</option>
      <option value="ui">UI</option>
      <option value="api">API</option>
      <option value="load">Load</option>
    </select>
  </div>

  <div class="panel">
    <div class="table">
      <div class="table-head">
        <span>Name</span><span>Type</span><span>Tags</span><span>Updated</span><span></span>
      </div>
      <div class="table-row">
        <span>
          <svg class="w-4 h-4 inline mr-2" style="color: var(--gray-500);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
          Login Flow Test
        </span>
        <span class="chip info">UI</span>
        <span class="flex gap-1">
          <span class="badge badge-pending">smoke</span>
          <span class="badge badge-pending">auth</span>
        </span>
        <span class="muted">Today</span>
        <span class="text-brand-400 text-sm">Edit</span>
      </div>
      <div class="table-row">
        <span>
          <svg class="w-4 h-4 inline mr-2" style="color: var(--gray-500);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
          API Health Check
        </span>
        <span class="chip success">API</span>
        <span class="flex gap-1">
          <span class="badge badge-pending">smoke</span>
        </span>
        <span class="muted">Today</span>
        <span class="text-brand-400 text-sm">Edit</span>
      </div>
      <div class="table-row">
        <span>
          <svg class="w-4 h-4 inline mr-2" style="color: var(--gray-500);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
          Checkout Process
        </span>
        <span class="chip info">UI</span>
        <span class="flex gap-1">
          <span class="badge badge-pending">regression</span>
          <span class="badge badge-pending">checkout</span>
        </span>
        <span class="muted">Yesterday</span>
        <span class="text-brand-400 text-sm">Edit</span>
      </div>
      <div class="table-row">
        <span>
          <svg class="w-4 h-4 inline mr-2" style="color: var(--gray-500);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
          User Registration
        </span>
        <span class="chip info">UI</span>
        <span class="flex gap-1">
          <span class="badge badge-pending">smoke</span>
          <span class="badge badge-pending">auth</span>
        </span>
        <span class="muted">Yesterday</span>
        <span class="text-brand-400 text-sm">Edit</span>
      </div>
      <div class="table-row">
        <span>
          <svg class="w-4 h-4 inline mr-2" style="color: var(--gray-500);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
          Search API
        </span>
        <span class="chip success">API</span>
        <span class="flex gap-1">
          <span class="badge badge-pending">regression</span>
        </span>
        <span class="muted">2 days ago</span>
        <span class="text-brand-400 text-sm">Edit</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
