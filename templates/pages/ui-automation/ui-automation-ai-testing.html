<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>AI Testing</h1>
      <p>Generate Playwright test scripts using natural language instructions</p>
    </div>
  </div>

  <div class="split-grid">
    <div class="panel">
      <div class="panel-header">
        <h3>Target Application</h3>
      </div>
      <form id="ai-test-form" class="form-stack">
        <div class="form-group">
          <label>URL</label>
          <input type="url" id="test-url" placeholder="https://example.com" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Username (optional)</label>
            <input type="text" id="test-username" placeholder="Username" />
          </div>
          <div class="form-group">
            <label>Password (optional)</label>
            <input type="password" id="test-password" placeholder="Password" />
          </div>
        </div>
        <div class="form-group">
          <label>Test Instruction</label>
          <textarea id="test-instruction" rows="3" placeholder="e.g., Login to the system with valid credentials and verify the dashboard loads correctly" required></textarea>
        </div>
        <div class="form-group">
          <label>AI Provider</label>
          <select id="ai-provider">
            <option value="opencode">opencode AI</option>
            <option value="openai">OpenAI GPT-4</option>
            <option value="ollama">Ollama Local</option>
            <option value="claude">Anthropic Claude</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="generate-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            Generate & Run Test
          </button>
          <button type="button" class="btn btn-secondary" id="analyze-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Analyze Page
          </button>
        </div>
      </form>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <h3>Terminal Output</h3>
        <button class="btn btn-sm btn-ghost" id="clear-terminal">Clear</button>
      </div>
      <div id="terminal-output" class="terminal">
        <div class="terminal-line">> AI Testing ready</div>
        <div class="terminal-line">> Enter a URL and test instruction to generate tests</div>
      </div>
    </div>
  </div>

  <div class="panel mt-4">
    <div class="panel-header">
      <h3>Generated Scripts</h3>
    </div>
    <div id="scripts-list" class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Script Name</th>
            <th>URL</th>
            <th>AI Provider</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="scripts-tbody">
          <tr><td colspan="6" class="text-center muted">No scripts generated yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script th:inline="javascript">
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('ai-test-form');
    const terminal = document.getElementById('terminal-output');
    const generateBtn = document.getElementById('generate-btn');
    const analyzeBtn = document.getElementById('analyze-btn');
    const clearBtn = document.getElementById('clear-terminal');
    
    function log(msg, type = 'info') {
      const line = document.createElement('div');
      line.className = 'terminal-line terminal-' + type;
      line.textContent = '> ' + msg;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }
    
    function clearTerminal() {
      terminal.innerHTML = '';
      log('Terminal cleared');
    }
    
    generateBtn.addEventListener('click', async function(e) {
      e.preventDefault();
      const url = document.getElementById('test-url').value;
      const instruction = document.getElementById('test-instruction').value;
      const provider = document.getElementById('ai-provider').value;
      
      if (!url || !instruction) {
        log('Error: URL and instruction are required', 'error');
        return;
      }
      
      generateBtn.disabled = true;
      generateBtn.textContent = 'Generating...';
      log('Generating test for: ' + url);
      log('Instruction: ' + instruction);
      
      try {
        const response = await fetch('/api/ai-test/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: url,
            instruction: instruction,
            aiProvider: provider,
            autoExecute: true
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          log('Script generated: ' + result.scriptName, 'success');
          log('Saved to: ' + result.filePath);
          if (result.executionStatus) {
            log('Execution status: ' + result.executionStatus);
            if (result.passedTests) log('Passed: ' + result.passedTests);
            if (result.failedTests) log('Failed: ' + result.failedTests, result.failedTests > 0 ? 'error' : 'info');
          }
          loadScripts();
        } else {
          log('Error: ' + result.message, 'error');
        }
      } catch (err) {
        log('Error: ' + err.message, 'error');
      }
      
      generateBtn.disabled = false;
      generateBtn.textContent = 'Generate & Run Test';
    });
    
    analyzeBtn.addEventListener('click', async function() {
      const url = document.getElementById('test-url').value;
      if (!url) {
        log('Error: Enter a URL first', 'error');
        return;
      }
      
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = 'Analyzing...';
      log('Analyzing page: ' + url);
      
      try {
        const response = await fetch('/api/ai-test/analyze?url=' + encodeURIComponent(url));
        const result = await response.json();
        log('Page title: ' + (result.title || 'N/A'));
        log('Elements found: ' + (result.elements ? result.elements.length : 0));
      } catch (err) {
        log('Analysis error: ' + err.message, 'error');
      }
      
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = 'Analyze Page';
    });
    
    clearBtn.addEventListener('click', clearTerminal);
    
    async function loadScripts() {
      try {
        const response = await fetch('/api/ai-test/scripts');
        const scripts = await response.json();
        const tbody = document.getElementById('scripts-tbody');
        
        if (scripts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center muted">No scripts generated yet</td></tr>';
          return;
        }
        
        tbody.innerHTML = scripts.map(function(s) {
          return '<tr>' +
            '<td>' + s.name + '</td>' +
            '<td class="text-sm">' + s.url + '</td>' +
            '<td>' + s.aiProvider + '</td>' +
            '<td><span class="chip ' + (s.status === 'EXECUTED' ? 'success' : s.status === 'FAILED' ? 'error' : 'soft') + '">' + s.status + '</span></td>' +
            '<td class="text-sm">' + (s.createdAt ? new Date(s.createdAt).toLocaleString() : '') + '</td>' +
            '<td><button class="btn btn-sm btn-ghost" onclick="runScript(' + s.id + ')">Run</button></td>' +
          '</tr>';
        }).join('');
      } catch (err) {
        log('Error loading scripts: ' + err.message, 'error');
      }
    }
    
    window.runScript = function(id) {
      log('Running script #' + id);
      fetch('/api/ai-test/run/' + id, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          log('Execution status: ' + result.status);
          if (result.passedTests) log('Passed: ' + result.passedTests);
          if (result.failedTests) log('Failed: ' + result.failedTests, result.failedTests > 0 ? 'error' : 'info');
          loadScripts();
        })
        .catch(function(err) {
          log('Run error: ' + err.message, 'error');
        });
    };
    
    loadScripts();
  });
  </script>
</div>
</body>
</html>
