<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="page-content">
  <div class="page-header">
    <div>
      <h1>Test Data</h1>
      <p>Manage test data files and datasets</p>
    </div>
    <div class="flex items-center gap-3">
      <select class="input w-48">
        <option>All Data Sets</option>
        <option>Login Data</option>
        <option>User Data</option>
        <option>Product Data</option>
      </select>
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Import Data
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Data Files</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/></svg>
      </div>
      <p class="text-3xl">24</p>
    </div>
    <div class="stat-card">
      <div class="flex items-center justify-between mb-4">
        <span class="muted">Total Records</span>
        <svg class="w-5 h-5 opacity-70" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      </div>
      <p class="text-3xl">1,456</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Data Sets</h3>
    </div>
    <ul class="list-rows">
      <li>
        <div class="dot green"></div>
        <div class="flex-1">
          <span>users.json</span>
          <span class="muted text-xs">250 records - JSON</span>
        </div>
        <span class="chip info">Active</span>
      </li>
      <li>
        <div class="dot green"></div>
        <div class="flex-1">
          <span>products.csv</span>
          <span class="muted text-xs">500 records - CSV</span>
        </div>
        <span class="chip info">Active</span>
      </li>
      <li>
        <div class="dot green"></div>
        <div class="flex-1">
          <span>login-data.xlsx</span>
          <span class="muted text-xs">45 records - Excel</span>
        </div>
        <span class="chip info">Active</span>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
